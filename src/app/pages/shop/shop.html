<h1>Shop</h1>

<label for="duck-search">Cerca nel catalogo</label>
<input
  id="duck-search"
  type="search"
  placeholder="Cerca una paperella..."
  (input)="onSearch($event)"
/>

<div class="filters">
  @for (cat of categories; track cat) {
    <button
      type="button"
      (click)="selected.set(cat)"
      [class.active]="selected() === cat"
      [attr.aria-pressed]="selected() === cat"
    >
      {{ cat }}
    </button>
  }
</div>

<section class="grid" aria-label="Catalogo paperelle">
  @for (duck of ducks(); track duck.id) {
    <article class="card">
      <!-- Quando avrai le foto, sostituisci il div con <img [src]="duck.image" [alt]="duck.name" />. -->
      <div class="photo" aria-hidden="true"></div>

      <h3>{{ duck.name }}</h3>
      <p>{{ duck.price | currency: 'EUR' }}</p>

      <div class="actions">
        <a [routerLink]="['/shop', duck.id]">Dettagli</a>
        <button
          type="button"
          (click)="addToCart(duck)"
          [disabled]="!duck.inStock"
        >
          {{ duck.inStock ? 'Aggiungi al carrello' : 'Esaurita' }}
        </button>
      </div>
    </article>
  } @empty {
    <p>Nessuna paperella trovata.</p>
  }
</section>
