@if (duck(); as d) {
  <article class="detail">
    <!-- Sostituire il riquadro con img usando d.image e d.name come alt. -->
      <div class="photo" aria-hidden="true"></div>
    <div>
    <h1>{{ d.name }}</h1>
    <p>{{ d.description }}</p>
    <p>Categoria: {{ d.category }}</p>
    <p>{{ d.price | currency: 'EUR' }}</p>
    <button (click)="addToCart()" [disabled]="!d.inStock">
      {{ d.inStock ? 'Aggiungi al carrello' : 'Esaurita' }}
    </button>
    </div>
  </article>
} @else {
  <p class="error">Paperella non trovata.</p>
}
<a routerLink="/shop">← Torna allo shop</a>
